<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Veille technologique quotidienne : IA, ServiceNow, cloud, cybersécurité et marché du logiciel.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2322409A'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Georgia,serif' font-size='38' fill='%23fff'%3EV%E2%80%99%3C/text%3E%3C/svg%3E">
<title>Veille tech’</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap">
<style>
/* Veille tech’ : trois colonnes (navigation, liste des actus, lecture) dans l'esprit d'une lettre du matin.
   Serif pour ce qui se lit, sans-serif pour ce qui se manipule. Les six couleurs servent uniquement aux catégories. */
:root {
  /* Thème clair : gris doux, sans blanc pur, pour ne pas éblouir. */
  --table: #C6CAD0; --list: #D9DCE0; --day: #CBCFD4; --paper: #DCDFE2; --ink: #20242A; --ink-2: #3A4048; --muted: #4E545B; --faint: #868C95;
  --rule: #C2C7CD; --rule-2: #CDD1D6; --accent: #22409A; --sel: #CCD3E0; --hover: rgba(34, 38, 44, .055); --focus: #22409A;
  --lift: 0 1px 0 rgba(34, 38, 44, .07); --shadow: 0 1px 0 rgba(34, 38, 44, .07), 0 24px 44px -34px rgba(34, 38, 44, .35); --fab-shadow: 0 10px 24px -8px rgba(34, 64, 154, .45);
  --mark-bg: #F2D877; --mark-ink: #22262C;
  --c-esm: #09614E; --c-agents: #5B3CB2; --c-securite: #99351F; --c-modeles: #1F519E; --c-cloud: #774C08; --c-marche: #922F60;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #18191B; --list: #1F2022; --day: #1A1B1D; --paper: #26272A; --ink: #ECECED; --ink-2: #C3C4C7; --muted: #95969B; --faint: #606166;
    --rule: #36373B; --rule-2: #2D2E31; --accent: #AFBDE0; --sel: #323337; --hover: rgba(255, 255, 255, .045); --focus: #AFBDE0;
    --lift: 0 0 0 1px #313236; --shadow: 0 0 0 1px #2F3034, 0 24px 44px -30px rgba(0, 0, 0, .75); --fab-shadow: 0 10px 24px -8px rgba(0, 0, 0, .75);
    --mark-bg: #6E5A12; --mark-ink: #FFF5D6;
    --c-esm: #4CC7A4; --c-agents: #AE95F5; --c-securite: #F08A74; --c-modeles: #7FB0F5; --c-cloud: #DDA650; --c-marche: #EA86B6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #18191B; --list: #1F2022; --day: #1A1B1D; --paper: #26272A; --ink: #ECECED; --ink-2: #C3C4C7; --muted: #95969B; --faint: #606166;
  --rule: #36373B; --rule-2: #2D2E31; --accent: #AFBDE0; --sel: #323337; --hover: rgba(255, 255, 255, .045); --focus: #AFBDE0;
  --lift: 0 0 0 1px #313236; --shadow: 0 0 0 1px #2F3034, 0 24px 44px -30px rgba(0, 0, 0, .75); --fab-shadow: 0 10px 24px -8px rgba(0, 0, 0, .75);
  --mark-bg: #6E5A12; --mark-ink: #FFF5D6;
  --c-esm: #4CC7A4; --c-agents: #AE95F5; --c-securite: #F08A74; --c-modeles: #7FB0F5; --c-cloud: #DDA650; --c-marche: #EA86B6;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--table); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
mark { background: var(--mark-bg); color: var(--mark-ink); border-radius: 3px; padding: 0 1px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cadre */
/* Colonnes fluides : elles s'élargissent avec l'écran, jusqu'à 2100 px de large au total. */
.app { --navw: clamp(240px, 14vw, 290px); --listw: clamp(380px, 23vw, 500px);
  height: 100vh; height: 100dvh; display: grid; grid-template-rows: 64px minmax(0, 1fr); max-width: 2100px; margin: 0 auto; }
.bar { display: grid; grid-template-columns: var(--navw) minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 0 14px 0 0; }
.brand { padding-left: 24px; font-family: var(--serif); font-size: 27px; font-weight: 500; font-variation-settings: "opsz" 72; letter-spacing: -.01em; line-height: 1; margin: 0; white-space: nowrap; }
.brand:focus { outline: none; }
.brand-btn { font: inherit; color: inherit; letter-spacing: inherit; line-height: inherit; }
.brand-btn:hover { color: var(--accent); }
.q { position: relative; max-width: 520px; display: block; }
.q svg.i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.q input { width: 100%; height: 38px; border: 0; border-radius: 19px; background: var(--paper); box-shadow: var(--lift); color: var(--ink);
  font: inherit; font-size: 14px; padding: 0 44px 0 42px; }
.q input::placeholder { color: var(--muted); }
.q input::-webkit-search-cancel-button { display: none; }
.q kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-family: var(--sans); font-size: 12px; color: var(--faint);
  border: 1px solid var(--rule); border-radius: 5px; padding: 0 6px; line-height: 18px; pointer-events: none; }
.q input:focus + kbd, .q input:not(:placeholder-shown) + kbd { display: none; }
.tools { display: flex; gap: 4px; align-items: center; }
.tool { height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 13px; border-radius: 19px; color: var(--ink-2); font-size: 14px; }
.tool:hover { background: var(--hover); color: var(--ink); }
.tool.icon { width: 38px; padding: 0; justify-content: center; }
.main { display: grid; grid-template-columns: var(--navw) var(--listw) minmax(0, 1fr); gap: 0 14px; padding: 0 14px 14px 0; min-height: 0; }
.mtop { display: none; }

/* Navigation */
.nav { padding: 6px 4px 24px 20px; overflow: auto; min-height: 0; }
.views { display: flex; flex-direction: column; gap: 2px; }
.nv { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 12px; border-radius: 18px; color: var(--ink-2); font-size: 14.5px; white-space: nowrap; }
.nv:hover { background: var(--hover); color: var(--ink); }
.nv[aria-selected="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: var(--lift); }
.nv .n { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; }
.cal-h { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 8px 4px; }
.cal-h h2 { font-family: var(--serif); font-size: 18px; font-weight: 500; margin: 0; }
.cal-nav { display: flex; }
.round { width: 30px; height: 30px; border-radius: 15px; display: inline-grid; place-items: center; color: var(--ink-2); }
.round:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.round:disabled { opacity: .3; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; text-align: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cal .wd { color: var(--faint); font-size: 11px; padding-bottom: 4px; }
.cal-day { height: 29px; width: 29px; margin: 0 auto; display: grid; place-items: center; border-radius: 50%; color: var(--faint); text-align: center; }
button.cal-day { color: var(--ink); font-weight: 600; }
button.cal-day:hover { background: var(--hover); }
button.cal-day.nomatch { color: var(--faint); font-weight: 400; }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--faint); }
button.cal-day[aria-pressed="true"] { background: var(--ink); color: var(--paper); box-shadow: none; }
.all { margin: 8px 0 0 4px; font-size: 13px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.th-h { font-family: var(--serif); font-style: italic; font-size: 16px; font-weight: 500; color: var(--ink-2); margin: 26px 4px 6px; }
.themes { display: flex; flex-direction: column; gap: 1px; }
.theme { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; height: 34px; padding: 0 12px;
  border-radius: 17px; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
.theme:hover { background: var(--hover); color: var(--ink); }
.theme i { width: 12px; height: 3px; border-radius: 2px; background: var(--c); }
.theme span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
.theme .n { color: var(--muted); font-weight: 400; font-size: 13px; font-variant-numeric: tabular-nums; }
.theme[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 600; box-shadow: var(--lift); }
.theme.allt { grid-template-columns: minmax(0, 1fr) auto; }

/* Liste */
.list { background: var(--list); border-radius: 6px; overflow: auto; box-shadow: var(--shadow); min-height: 0; overscroll-behavior: contain; }
/* Le jour reste en haut de la liste pendant le défilement ; l'essentiel du jour s'affiche en entier dessous. */
.grp-t { position: sticky; top: 0; z-index: 1; background: var(--day); display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
  padding: 16px 20px 8px; }
.grp-l { display: flex; align-items: center; gap: 6px; min-width: 0; }
.day-btn { font: inherit; color: inherit; text-align: left; }
.day-btn:hover:not(:disabled) { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
.grp-p.go { cursor: pointer; }
.pdf-ic { width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.pdf-ic:hover { background: var(--hover); color: var(--accent); }
.pdf-ic svg.i { width: 18px; height: 18px; }
.pdf-ic.busy { cursor: progress; color: var(--accent); }
.pdf-ic.busy svg.i { animation: pdfpulse 1s ease-in-out infinite; }
@keyframes pdfpulse { 50% { opacity: .3; } }
.per-wrap { position: relative; }
.per-wrap .row.per { padding-right: 52px; }
.per-wrap .pdf-ic { position: absolute; top: 12px; right: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; max-width: calc(100vw - 140px);
  background: var(--ink); color: var(--paper); font-size: 13.5px; padding: 10px 16px; border-radius: 10px; box-shadow: 0 12px 28px -12px rgba(0, 0, 0, .5); }
.grp-t h2 { font-family: var(--serif); font-size: 20px; font-weight: 500; font-variation-settings: "opsz" 36; margin: 0; line-height: 1.2; }
.grp-t .n { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.grp-p { margin: 0; padding: 0 20px 14px; background: var(--day); border-bottom: 1px solid var(--rule); color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }
.grp-p.empty { padding-bottom: 6px; }
.row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 6px; width: 100%; padding: 14px 20px 15px 16px; border-bottom: 1px solid var(--rule-2); position: relative; }
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--sel); }
.row[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: var(--accent); }
.row:focus-visible { outline-offset: -2px; border-radius: 0; }
.row .r { font-family: var(--serif); font-size: 22px; font-weight: 300; color: var(--faint); line-height: 1; padding-top: 1px; font-variation-settings: "opsz" 72; }
.row .rb { display: block; min-width: 0; }
.k { display: flex; gap: 4px 10px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.k b { display: inline-flex; align-items: center; gap: 6px; color: var(--c); font-weight: 600; }
.k b::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.k i { font-style: italic; font-family: var(--serif); font-size: 13.5px; color: var(--ink-2); }
.row .t { display: block; font-family: var(--serif); font-size: 17px; line-height: 1.32; font-weight: 500; color: var(--ink); font-variation-settings: "opsz" 24; }
.row.bref .r { padding-top: 0; color: var(--faint); }
.row.bref .r svg.i { width: 17px; height: 17px; }
.row.bref .k b { color: var(--ink-2); }
.row .t.tb { font-size: 15px; line-height: 1.45; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.per { grid-template-columns: minmax(0, 1fr); padding-left: 20px; }
.row.per .pt { display: block; font-family: var(--serif); font-size: 20px; font-weight: 500; line-height: 1.2; margin-bottom: 4px; font-variation-settings: "opsz" 36; }
.row.per .t { font-size: 15px; font-weight: 400; color: var(--ink-2); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.msg { padding: 28px 24px; }
.msg b { display: block; font-family: var(--serif); font-size: 20px; font-weight: 500; margin-bottom: 6px; }
.msg span { color: var(--muted); }
.msg button { margin-top: 12px; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Lecture */
.detail { container-type: inline-size; background: var(--paper); border-radius: 6px; overflow: auto; box-shadow: var(--shadow); padding: 40px clamp(36px, 5%, 72px) 140px; min-height: 0; overscroll-behavior: contain; }
.back { display: none; }
.d-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; font-size: 13.5px; color: var(--muted); }
.d-top .l { display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; }
.d-top .vd { font-size: 12.5px; color: var(--muted); }
.d-top .cat { display: inline-flex; align-items: center; gap: 7px; color: var(--c); font-weight: 600; }
.d-top .cat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.d-top .suite { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink-2); }
.pos { display: flex; gap: 2px; }
.d-title { font-family: var(--serif); font-size: 34px; line-height: 1.16; font-weight: 480; letter-spacing: -.012em; margin: 0 0 16px; max-width: 22em;
  font-variation-settings: "opsz" 60; text-wrap: balance; }
.d-title:focus { outline: none; }
.d-meta { display: flex; align-items: center; gap: 6px 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; margin-bottom: 26px; }
.open { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; text-decoration: none; }
.open:hover { text-decoration: underline; text-underline-offset: 3px; }
.open svg.i { width: 15px; height: 15px; }
.read { max-width: 620px; }
.read p { font-family: var(--serif); font-size: 19px; line-height: 1.62; margin: 0 0 16px; font-variation-settings: "opsz" 16; }
.runin { font-style: italic; font-weight: 600; color: var(--accent); }
.note { margin: 26px 0 0; padding: 2px 0 2px 18px; border-left: 2px solid var(--rule); font-size: 14.5px; line-height: 1.6; color: var(--ink-2); max-width: 620px; }
.note h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 17px; margin: 0 0 4px; color: var(--ink); }
.note p { margin: 0; }
.kw { margin-top: 14px; color: var(--muted); font-size: 13px; }
.brief { margin-top: 40px; border-top: 1px solid var(--ink); padding-top: 18px; max-width: 620px; }
.brief h3, .sec h3 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 21px; margin: 0 0 10px; }
.brief ul, .sec ul { margin: 0; padding-left: 18px; }
.brief li, .sec li { font-family: var(--serif); font-size: 16.5px; line-height: 1.55; margin: 0 0 9px; color: var(--ink-2); }
.brief li::marker, .sec li::marker { color: var(--faint); }
.src-link { font-family: var(--sans); font-size: 13px; color: var(--muted); }
.d-foot { margin-top: 32px; display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid var(--rule); color: var(--ink-2); font-size: 14px; background: var(--paper); }
.btn:hover:not(:disabled) { border-color: var(--faint); color: var(--ink); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.solid { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }
.btn.solid:hover:not(:disabled) { opacity: .88; color: var(--paper); }
.d-note { font-size: 13px; color: var(--muted); }
.next-nav { margin-top: 40px; padding-top: 22px; border-top: 1px solid var(--rule); max-width: 620px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.next-card { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 18px; align-items: center; padding: 15px 18px 17px;
  border-radius: 10px; background: var(--list); box-shadow: inset 0 0 0 1px var(--rule); }
.next-card:hover { background: var(--sel); }
.next-card .nl { grid-column: 1; font-size: 12.5px; color: var(--muted); }
.next-card .k { grid-column: 1; margin: 3px 0 0; }
.next-card .nt { grid-column: 1; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-family: var(--serif); font-size: 20px; line-height: 1.3; font-weight: 500; color: var(--ink); font-variation-settings: "opsz" 24; }
.next-card > svg.i { grid-column: 2; grid-row: 1 / 4; width: 22px; height: 22px; color: var(--accent); transition: transform .15s ease; }
.next-card:hover > svg.i { transform: translateX(3px); }
.prev-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); padding: 4px 2px; }
.prev-link:hover { color: var(--ink); }
.prev-link svg.i { width: 16px; height: 16px; }
.end-note { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--muted); margin: 0; }
.d-empty { color: var(--muted); font-family: var(--serif); font-style: italic; font-size: 19px; padding-top: 12px; }

/* Lecture large : « Pourquoi ça compte » passe dans la marge et suit la lecture */
@container (min-width: 780px) {
  .d-body { display: grid; grid-template-columns: minmax(0, 740px) clamp(220px, 26cqi, 340px); column-gap: clamp(32px, 5cqi, 72px); align-items: start; }
  .d-body > * { grid-column: 1; max-width: none; }
  .d-body > .note { grid-column: 2; grid-row: 1 / span 4; margin-top: 6px; position: sticky; top: 0; }
}

.briefs { max-width: 620px; margin-top: 8px; }
.bf { padding: 20px 0; border-top: 1px solid var(--rule); }
.bf:first-child { border-top: 0; padding-top: 4px; }
.bf-t { font-family: var(--serif); font-size: 19px; line-height: 1.58; margin: 0 0 8px; font-variation-settings: "opsz" 16; }
.bf-m { display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); }

@container (min-width: 1000px) {
  .d-title { font-size: 38px; }
  .read p, .bf-t { font-size: 20px; }
  .note { font-size: 15px; }
  .lede { font-size: 23px; }
}
@media (min-width: 1800px) {
  .row .t { font-size: 18px; }
  .grp-t h2 { font-size: 21px; }
  .grp-p { font-size: 14px; }
  .nv, .theme { font-size: 15px; }
}

/* Synthèses */
.kind { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
.lede { font-family: var(--serif); font-size: 22px; line-height: 1.48; color: var(--ink-2); margin: 0 0 22px; max-width: 32em; font-variation-settings: "opsz" 24; }
.stats { margin: 26px 0 0; max-width: 660px; font-size: 13.5px; color: var(--ink-2); }
.stats .bars { display: flex; height: 6px; gap: 2px; border-radius: 3px; overflow: hidden; margin: 8px 0 10px; }
.stats .bars i { display: block; height: 100%; min-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.stats .srcs { color: var(--muted); margin-top: 8px; }
.sec { margin-top: 38px; border-top: 1px solid var(--ink); padding-top: 18px; max-width: 660px; }
.th { padding: 16px 0 18px; border-top: 1px solid var(--rule); }
.th:first-of-type { border-top: 0; padding-top: 4px; }

  function setTab(t, fromHash) {

  // ---------- chargement (site public : l'archive est publiée en fichiers JSON à côté de la page)

 "bbc.co.uk", "theguardian.com", "politico.eu", "euractiv.com", "semafor.com", "fortune.com", "theinformation.com"]], ["Presse tech internationale", ["theregister.com", "techcrunch.com", "venturebeat.com", "siliconangle.com", "cio.com", "computerworld.com", "infoworld.com", "networkworld.com", "csoonline.com", "arstechnica.com", "technologyreview.com", "theverge.com", "wired.com", "zdnet.com", "techtarget.com", "computerweekly.com", "diginomica.com", "thenewstack.io", "crn.com", "sdxcentral.com", "itpro.com", "thestack.technology", "computing.co.uk", "geekwire.com", "the-decoder.com", "datacenterdynamics.com", "datacenterknowledge.com", "thenextplatform.com"]], ["Presse cybersécurité et vie privée", ["darkreading.com", "bleepingcomputer.com", "therecord.media", "securityweek.com", "infosecurity-magazine.com", "cyberscoop.com", "krebsonsecurity.com", "scworld.com", "iapp.org"]], ["Institutions et régulateurs", ["gouv.fr", "cnil.fr", "europa.eu", "cigref.fr", "numeum.fr", "arcep.fr", "senat.fr", "assemblee-nationale.fr", "autoritedelaconcurrence.fr", "ccomptes.fr", "banque-france.fr", "clusif.fr", "cesin.fr", "afnor.org", "oecd.org", "oecd.ai", "nist.gov", "cisa.gov", "ftc.gov", "ncsc.gov.uk", "ico.org.uk", "bsi.bund.de"]], ["Analystes, études et recherche", ["gartner.com", "forrester.com", "idc.com", "mckinsey.com", "bcg.com", "deloitte.com", "capgemini.com", "accenture.com", "canalys.com", "everestgrp.com", "isg-one.com", "constellationr.com", "hfsresearch.com", "hai.stanford.edu", "epoch.ai"]], ["Sites officiels d'éditeurs (seulement quand l'annonce elle-même est l'actu)", ["servicenow.com", "microsoft.com", "google.com", "blog.google", "deepmind.google", "amazon.com", "aboutamazon.com", "openai.com", "anthropic.com", "mistral.ai", "sap.com", "salesforce.com", "atlassian.com", "ibm.com", "oracle.com", "nvidia.com", "meta.com", "fb.com", "github.blog", "workday.com", "snowflake.com", "databricks.com", "zendesk.com", "bmc.com", "ivanti.com", "freshworks.com", "pagerd   function domainList(list) {
    var box = el("div", { class: "domains" });
    list.forEach(function (d) {
      var href = d === "gouv.fr" ? "https://www.info.gouv.fr/" : "https://" + d + "/";

  }
  function renderSources() {
    var body = document.getElementById("src-body");
    if (body.firstChild) return;
    var packs = el("section", { class: "src-sec" }, el("h3", { text: "Recherches du matin, dans l'ordre" }));
    VEILLE_SOURCES.packs.forEach(function (pk) {
      packs.appendChild(el("div", { class: "src-group" }, el("b", null, pk[0], el("span", { text: plural(pk[1].length, "site", "sites") })), domainList(pk[1])));

    packs.appendChild(el("p", { class: "src-note", text: "Les autres sites acceptés (Reuters, Les Echos, Le Monde, Politico, Euractiv…) ne figurent dans aucun paquet parce que la recherche ne sait pas les filtrer. Ils servent à recouper une info, ou quand une recherche sans filtre les fait remonter." }));

  var srcDialog = document.getElementById("src-dialog");

  srcDialog.addEventListener("click", function (ev) { if (ev.target === srcDialog && srcDialog.close) srcDialog.close(); });

  // ---------- commandes
  // Le logo ramène à l'accueil : vue quotidienne du mois en cours, sans filtre, première actu ouverte, tout en haut.
  function goHome() {
    var otherMonth = state.month !== thisMonth;
    state.tab = "quotidien"; state.cat = null; state.day = null; state.q = ""; searchInput.value = "";
    state.sel = null; state.detailOpen = false; state.navOpen = false; resetList = true;

  }
  document.getElementById("home").addEventListener("click", goHome);
  document.querySelectorAll("[data-tab]").forEach(function (b) { b.addEventListener("click", function () { setTab(b.getAttribute("data-tab")); }); });
  document.getElementById("ftoggle").addEventListener("click", function () { state.navOpen = !state.navOpen; render(); });
  var searchTimer = null;
  searchInput.addEventListener("input", function (ev) {
    var v = ev.target.value; clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { if (state.q === v.trim()) return; state.q = v.trim(); state.sel = null; resetList = true; render(); }, 140);
  });
  searchInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && searchInput.value) { ev.preventDefault(); searchInput.value = ""; state.q = ""; state.sel = null; resetList = true; render(); }
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "/" || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    var t = ev.target, tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;

    if (srcDialog.open || (askBox && !askBox.hidden)) return;
    ev.preventDefault(); searchInput.focus();
  });
  listBox.addEventListener("keydown", function (ev) {
    if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
    var rows = Array.prototype.slice.call(listBox.querySelectorAll(".row"));
    var i = rows.indexOf(document.activeElement); if (i < 0) return;
    var n = rows[i + (ev.key === "ArrowDown" ? 1 : -1)];
    if (n) { ev.preventDefault(); n.focus(); }
  });
  window.addEventListener("hashchange", function () { setTab(location.hash.replace("#", ""), true); });
  if (compactMq) {
    var onCompact = function () { render(); };
    if (compactMq.addEventListener) compactMq.addEventListener("change", onCompact); else if (compactMq.addListener) compactMq.addListener(onCompact);
  }

  // ---------- retour en haut
  var toTop = document.getElementById("to-top");

  window.addEventListener("scroll", syncToTop, { passive: true });
  listBox.addEventListener("scroll", syncToTop, { passive: true });

  toTop.addEventListener("click", function () {
    var how = reduceMotion() ? "auto" : "smooth";
    [window, listBox, detailBox].forEach(function (box) { try { box.scrollTo({ top: 0, behavior: how }); } catch (e) { if (box === window) window.scrollTo(0, 0); else box.scrollTop = 0; } });
    document.querySelector(".brand").focus({ preventScroll: true });
  });

  var h = location.hash.replace("#", "");
  if (h) state.tab = ["quotidien", "hebdo", "mensuel"].indexOf(h) > -1 ? h : "quotidien";

  state.available = true;

  loadPeriods("weekly", "weekly.json", "start");
